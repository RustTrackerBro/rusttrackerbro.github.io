<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Tracker Bro — Telegram</title>
<meta name="robots" content="noindex">
<style>body{background:#14110f;color:#f1ece2;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#f08a4b}</style>
</head>
<body>
<p><a id="go" href="https://t.me/RustTrackerBroBot">t.me/RustTrackerBroBot</a></p>
<script src="../config.js"></script>
<script>
(function () {
  var cfg = window.RTB || {};
  var p = new URLSearchParams(location.search);
  var ref = (p.get("ref") || "").replace(/[^0-9]/g, "").slice(0, 20);
  var url = "https://t.me/" + (cfg.TELEGRAM_BOT || "RustTrackerBroBot") + (ref ? "?start=ref_" + ref : "");
  document.getElementById("go").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
