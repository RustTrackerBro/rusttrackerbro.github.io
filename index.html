<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Tracker Bro — Rust player tracker bot for Discord & Telegram</title>
<meta name="description" content="Alerts when Rust players join or leave a server, your clan's online, play and sleep times, Rust+ events — in Discord and Telegram.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rust Tracker Bro">
<meta property="og:title" content="Rust Tracker Bro — Discord & Telegram">
<meta property="og:description" content="Rust player alerts, clan online, play and sleep times, Rust+ events.">
<meta property="og:image" content="https://rusttrackerbro.com/assets/og.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:url" content="https://rusttrackerbro.com/">
<link rel="canonical" href="https://rusttrackerbro.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#a8ff3e">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/avatar.png">
<style>
  @font-face { font-family: "Russo One"; src: url("assets/RussoOne-Regular.ttf") format("truetype"); font-display: swap; }
  :root {
    --steel: #15191e; --steel-2: #1b2026; --steel-3: #232a31; --line: #2e363e;
    --bone: #f1ece2; --muted: #9aa3ab; --rust: #d8692a; --rust-hot: #f08a4b; --neon: #a8ff3e;
    --discord: #5865f2; --tg: #2aabee; --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(900px 520px at 18% -8%, rgba(216, 105, 42, .28), transparent 62%),
      radial-gradient(700px 420px at 100% 0%, rgba(168, 255, 62, .07), transparent 60%),
      var(--steel);
    color: var(--bone); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 28px 16px 40px; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 760px; }

  /* Шапка — как баннер бота: аватар в неоновом кольце и надпись */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; padding: 8px 4px 22px; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; position: relative; flex: none;
            box-shadow: 0 0 0 4px #0c0f12, 0 0 0 7px var(--neon), 0 0 38px 6px rgba(168, 255, 62, .28); }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .word { font-family: "Russo One", system-ui, sans-serif; line-height: .95; margin: 0; }
  .word .big { display: block; font-size: clamp(38px, 7.2vw, 62px); letter-spacing: .5px; color: var(--bone); }
  .word .sub { display: block; font-size: clamp(20px, 3.4vw, 28px); letter-spacing: .42em; color: var(--rust); margin-top: 10px; }
  .pulse { margin: 16px 0 0; color: var(--neon); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 9px; }
  .pulse::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--neon);
                   box-shadow: 0 0 0 0 rgba(168, 255, 62, .7); animation: ping 2s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(168, 255, 62, 0); } 100% { box-shadow: 0 0 0 0 rgba(168, 255, 62, 0); } }
  .lead { color: var(--muted); margin: 6px 0 0; font-size: 15px; }

  .panel { background: linear-gradient(180deg, var(--steel-2), #171b20); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 22px; margin-top: 18px; }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #fff;
         font-weight: 700; font-size: 17px; padding: 16px 18px; border-radius: 14px; border: 0; cursor: pointer;
         transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn.discord { background: var(--discord); box-shadow: 0 6px 18px rgba(88, 101, 242, .35); }
  .btn.tg { background: var(--tg); box-shadow: 0 6px 18px rgba(42, 171, 238, .3); }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.07); box-shadow: 0 0 0 2px var(--neon), 0 10px 26px rgba(168, 255, 62, .18); }
  .btn:focus-visible { outline: 3px solid var(--neon); outline-offset: 3px; }
  .dm-hint { margin: 12px 0 0; font-size: 14px; color: var(--muted); text-align: center; }
  .dm-hint a { color: var(--rust-hot); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .dm-hint a:hover, .dm-hint a:focus-visible { text-decoration: underline; }

  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .feat { display: flex; gap: 14px; align-items: flex-start; background: var(--steel-2); border: 1px solid var(--line);
          border-radius: 14px; padding: 16px; }
  .feat.wide { grid-column: 1 / -1; }
  .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 21px;
         background: rgba(216, 105, 42, .12); border: 1px solid rgba(216, 105, 42, .45); }
  .feat b { display: block; font-size: 15.5px; margin-bottom: 2px; }
  .feat span { color: var(--muted); font-size: 14.5px; }

  .invite { border-color: var(--rust); background:
            linear-gradient(135deg, rgba(216, 105, 42, .16), rgba(216, 105, 42, .04) 60%), var(--steel-2); }
  .invite h2 { font-family: "Russo One", system-ui, sans-serif; font-weight: 400; font-size: 21px; margin: 0 0 4px; }
  .gift { color: var(--neon); font-weight: 700; margin: 0 0 12px; }
  .invite p { margin: 8px 0; color: var(--muted); }
  .steps { margin: 6px 0 0; padding-left: 20px; color: var(--bone); }
  .code { display: flex; gap: 8px; margin: 12px 0 4px; }
  .code code { flex: 1; min-width: 0; background: #0f1215; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
               font: 700 17px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--rust-hot); overflow-x: auto; white-space: nowrap; }
  .copy { background: var(--rust); color: #1a0f08; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 800; cursor: pointer; }
  .copy:hover { background: var(--rust-hot); }

  .pricing-link { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; padding: 15px 18px; border-radius: 14px;
                  border: 1px solid var(--rust); color: var(--bone); font-weight: 700; text-decoration: none;
                  background: linear-gradient(135deg, rgba(216, 105, 42, .18), rgba(216, 105, 42, .04)); transition: transform .15s ease, box-shadow .15s ease; }
  .pricing-link:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--neon), 0 10px 26px rgba(168, 255, 62, .15); }
  .pricing-link:focus-visible { outline: 3px solid var(--neon); outline-offset: 3px; }
  .calc-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .calc-links a { display: flex; justify-content: center; align-items: center; padding: 12px 10px; border-radius: 14px; border: 1px solid var(--line);
                  background: var(--steel-2); color: var(--bone); font-weight: 700; font-size: 14.5px; text-decoration: none; text-align: center; }
  .calc-links a:hover { border-color: var(--neon); }
  
  footer { text-align: center; margin-top: 30px; }
  .support { color: var(--bone); font-size: 14.5px; }
  .support code { color: var(--rust-hot); font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .legal { color: #6f7880; font-size: 12px; margin-top: 6px; }
  .legal-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; margin-top: 8px; }
  .legal-links a { color: #9aa3ab; text-decoration: none; font-weight: 400; }
  .legal-links a:hover { color: #f08a4b; text-decoration: underline; }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
  .langs button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .langs button[aria-pressed="true"] { color: var(--bone); border-color: var(--neon); }
  [hidden] { display: none !important; }

  @media (max-width: 620px) {
    .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 22px; }
    .avatar { width: 128px; height: 128px; }
    .pulse { justify-content: center; }
    .btns, .features { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse::before { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="avatar"><img src="assets/avatar.png" alt="Rust Tracker Bro" width="256" height="256"></div>
    <div>
      <h1 class="word"><span class="big">RUST TRACKER</span><span class="sub">BROBOT</span></h1>
      <p class="pulse" data-t="pulse"></p>
      <p class="lead" data-t="tag"></p>
    </div>
  </header>

  <section class="panel invite" id="invite" hidden>
    <h2 data-t="invite_title"></h2>
    <p class="gift" data-t="invite_gift"></p>
    <p data-t="invite_dc"></p>
    <ol class="steps">
      <li data-t="invite_step1"></li>
      <li data-t="invite_step2"></li>
    </ol>
    <div class="code"><code id="start-cmd"></code><button class="copy" id="copy" type="button" data-t="copy"></button></div>
    <p data-t="invite_tg"></p>
  </section>

  <section class="panel">
    <div class="btns">
      <a class="btn discord" id="btn-discord" href="discord/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 -.3 13.6.1 18.1A19.9 19.9 0 0 0 6.2 21l1.3-2a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.8 19.8 0 0 0 6.1-2.9c.5-5.2-.8-9.7-3.6-13.7ZM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        <span data-t="btn_discord"></span>
      </a>
      <a class="btn tg" id="btn-tg" href="telegram/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 19.8c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.4 1.1 11.9c-1.1-.3-1.1-1.1.2-1.6L20.5 2.9c.9-.3 1.7.2 1.4 1.4Z"/></svg>
        <span data-t="btn_tg"></span>
      </a>
    </div>
    <p class="dm-hint" id="dm-hint" hidden><span data-t="dm_hint"></span> <a id="dm-link" href="#" data-t="dm_link"></a></p>
  </section>

  <section class="features">
    <div class="feat"><div class="ico">🔔</div><div><b data-t="f1_t"></b><span data-t="f1"></span></div></div>
    <div class="feat"><div class="ico">🛡</div><div><b data-t="f2_t"></b><span data-t="f2"></span></div></div>
    <div class="feat"><div class="ico">😴</div><div><b data-t="f3_t"></b><span data-t="f3"></span></div></div>
    <div class="feat"><div class="ico">📡</div><div><b data-t="f4_t"></b><span data-t="f4"></span></div></div>
    <div class="feat wide"><div class="ico">🖥</div><div><b data-t="f5_t"></b><span data-t="f5"></span></div></div>
  </section>

  <a class="pricing-link" href="pricing/" data-t="pricing_link"></a>
  <nav class="calc-links" aria-label="Rust calculators">
    <a href="raid/" data-t="calc_raid">💣 Raid calculator</a>
    <a href="craft/" data-t="calc_craft">🛠 Craft</a>
    <a href="recycle/" data-t="calc_recycle">♻️ Recycle</a>
    <a href="genes/" data-t="calc_genes">🧬 Gene planner</a>
  </nav>

  <footer>
    <div class="support" id="support"></div>
    <div class="legal-links" data-base="legal/"></div>
    <div class="legal" data-t="legal"></div>
    <div class="langs" id="langs"></div>
  </footer>
</main>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="legal/texts.js"></script>
<script src="legal/legal.js"></script>
<script>
(function () {
  var cfg = window.RTB || {};
  var T = window.RTB_TEXT;
  var params = new URLSearchParams(location.search);
  var ref = (params.get("ref") || "").replace(/[^0-9]/g, "").slice(0, 20);
  var partner = (params.get("p") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 32);
  var start = ref ? "ref_" + ref : (partner ? "p_" + partner : "");

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem("rtb_lang"); } catch (e) {}
    var wanted = (params.get("lang") || saved || navigator.language || "en").slice(0, 2).toLowerCase();
    return T[wanted] ? wanted : "en";
  }

  function render(lang) {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var key = el.getAttribute("data-t");
      if (t[key] !== undefined) el.textContent = t[key];
    });
    // «Поддержка и новости — в боте: /support» — команда выделена
    var sup = document.getElementById("support");
    sup.textContent = t.support + " ";
    var code = document.createElement("code"); code.textContent = "/support"; sup.appendChild(code);
    document.querySelectorAll("#langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
    if (window.RTB_LEGAL_LINKS) window.RTB_LEGAL_LINKS(lang);
  }

  var tgUrl = "https://t.me/" + cfg.TELEGRAM_BOT + (start ? "?start=" + encodeURIComponent(start) : "");
  document.getElementById("btn-tg").href = tgUrl;
  if (cfg.DISCORD_APP_ID) {
    document.getElementById("btn-discord").href = "https://discord.com/oauth2/authorize?client_id=" + cfg.DISCORD_APP_ID;
    // После добавления личка с ботом не появляется в списке сама — ведём в профиль бота (кнопка «Сообщение»).
    document.getElementById("dm-link").href = "https://discord.com/users/" + cfg.DISCORD_APP_ID;
    document.getElementById("dm-hint").hidden = false;
  }

  if (start) {
    document.getElementById("invite").hidden = false;
    document.getElementById("start-cmd").textContent = "/start " + start;
    document.getElementById("copy").addEventListener("click", function () {
      var btn = this, lang = document.documentElement.lang;
      var done = function () { btn.textContent = T[lang].copied; setTimeout(function () { btn.textContent = T[lang].copy; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText("/start " + start).then(done, done); else done();
    });
  }

  var langs = document.getElementById("langs");
  ["en", "ru", "es", "fr", "uk", "de", "tr", "pt"].filter(function (c) { return T[c]; }).forEach(function (code) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.lang = code; b.textContent = T[code].name;
    b.addEventListener("click", function () {
      try { localStorage.setItem("rtb_lang", code); } catch (e) {}
      render(code);
    });
    langs.appendChild(b);
  });
  render(pickLang());
})();
</script>
</body>
</html>
