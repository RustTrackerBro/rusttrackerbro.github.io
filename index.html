<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust Tracker Bro — Discord & Telegram bot for Rust</title>
<meta name="description" content="Get pinged when Rust players join or leave a server, see your clan's online and wipe alerts — in Discord and Telegram.">
<meta property="og:title" content="Rust Tracker Bro">
<meta property="og:description" content="Rust player tracker bot — Discord & Telegram.">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e86c24'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%2314110f' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%2314110f'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14110f; --card: #1e1a17; --line: #332c26; --text: #f1ece2; --muted: #a39b91;
    --rust: #e86c24; --rust-2: #f08a4b; --discord: #5865f2; --tg: #2aabee; --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #2a1a10 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 48px;
  }
  main { width: 100%; max-width: 560px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: var(--rust); display: grid; place-items: center; flex: none; }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: .2px; }
  .tag { color: var(--muted); margin: 2px 0 0; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-top: 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: flex; gap: 10px; }
  li span:first-child { flex: none; width: 24px; text-align: center; }
  .btns { display: grid; gap: 12px; margin-top: 20px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #fff;
         font-weight: 600; font-size: 17px; padding: 15px 18px; border-radius: 12px; border: 0; cursor: pointer; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn.discord { background: var(--discord); }
  .btn.tg { background: var(--tg); }
  .btn:focus-visible { outline: 3px solid var(--rust-2); outline-offset: 2px; }
  .btn:hover { filter: brightness(1.08); }
  .invite { border-color: var(--rust); }
  .invite h2 { font-size: 18px; margin: 0 0 6px; }
  .invite p { margin: 6px 0; color: var(--muted); }
  .code { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .code code { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
               font: 600 16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--rust-2); overflow-x: auto; white-space: nowrap; }
  .copy { background: var(--line); color: var(--text); border: 0; border-radius: 10px; padding: 0 14px; font-weight: 600; cursor: pointer; }
  .steps { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
  .steps li { display: list-item; }
  .gift { color: var(--rust-2); font-weight: 600; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
  .langs button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .langs button[aria-pressed="true"] { color: var(--text); border-color: var(--rust); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#14110f" stroke-width="2.6"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="#14110f"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>
    </div>
    <div>
      <h1>Rust Tracker Bro</h1>
      <p class="tag" data-t="tag"></p>
    </div>
  </div>

  <section class="card invite" id="invite" hidden>
    <h2 data-t="invite_title"></h2>
    <p class="gift" data-t="invite_gift"></p>
    <p data-t="invite_dc"></p>
    <ol class="steps">
      <li data-t="invite_step1"></li>
      <li data-t="invite_step2"></li>
    </ol>
    <div class="code"><code id="start-cmd"></code><button class="copy" id="copy" type="button" data-t="copy"></button></div>
    <p data-t="invite_tg"></p>
  </section>

  <section class="card">
    <ul>
      <li><span>🟢</span><span data-t="f1"></span></li>
      <li><span>👥</span><span data-t="f2"></span></li>
      <li><span>📊</span><span data-t="f3"></span></li>
      <li><span>🔗</span><span data-t="f4"></span></li>
      <li><span>🧹</span><span data-t="f5"></span></li>
    </ul>
    <div class="btns">
      <a class="btn discord" id="btn-discord" href="discord/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.4C.6 9 -.3 13.6.1 18.1A19.9 19.9 0 0 0 6.2 21l1.3-2a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2a19.8 19.8 0 0 0 6.1-2.9c.5-5.2-.8-9.7-3.6-13.7ZM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        <span data-t="btn_discord"></span>
      </a>
      <a class="btn tg" id="btn-tg" href="telegram/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 19.8c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.4 1.1 11.9c-1.1-.3-1.1-1.1.2-1.6L20.5 2.9c.9-.3 1.7.2 1.4 1.4Z"/></svg>
        <span data-t="btn_tg"></span>
      </a>
    </div>
  </section>

  <footer>
    <div data-t="footer"></div>
    <div class="langs" id="langs"></div>
  </footer>
</main>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
(function () {
  var cfg = window.RTB || {};
  var T = window.RTB_TEXT;
  var params = new URLSearchParams(location.search);
  var ref = (params.get("ref") || "").replace(/[^0-9]/g, "").slice(0, 20);
  var partner = (params.get("p") || "").toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 32);
  var start = ref ? "ref_" + ref : (partner ? "p_" + partner : "");

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem("rtb_lang"); } catch (e) {}
    var wanted = params.get("lang") || saved || (navigator.language || "en");
    wanted = wanted.slice(0, 2).toLowerCase();
    return T[wanted] ? wanted : "en";
  }

  function render(lang) {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var key = el.getAttribute("data-t");
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll("#langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
  }

  // Ссылки: Discord — добавление бота (или страница-подсказка), Telegram — бот с приглашением.
  var tgUrl = "https://t.me/" + cfg.TELEGRAM_BOT + (start ? "?start=" + encodeURIComponent(start) : "");
  document.getElementById("btn-tg").href = tgUrl;
  if (cfg.DISCORD_APP_ID) {
    document.getElementById("btn-discord").href = "https://discord.com/oauth2/authorize?client_id=" + cfg.DISCORD_APP_ID;
  }

  if (start) {
    document.getElementById("invite").hidden = false;
    document.getElementById("start-cmd").textContent = "/start " + start;
    document.getElementById("copy").addEventListener("click", function () {
      var btn = this, lang = document.documentElement.lang;
      var done = function () { btn.textContent = T[lang].copied; setTimeout(function () { btn.textContent = T[lang].copy; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText("/start " + start).then(done, done); else done();
    });
  }

  var langs = document.getElementById("langs");
  Object.keys(T).forEach(function (code) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.lang = code; b.textContent = T[code].name;
    b.addEventListener("click", function () {
      try { localStorage.setItem("rtb_lang", code); } catch (e) {}
      render(code);
    });
    langs.appendChild(b);
  });
  render(pickLang());
})();
</script>
</body>
</html>
